[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pii-shield-tr"
version = "0.1.0"
description = "Mask personal data in Turkish text before it reaches an LLM, and restore it afterwards."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Oğuzhan Balım" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pii-shield = "pii_shield_tr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_shield_tr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
